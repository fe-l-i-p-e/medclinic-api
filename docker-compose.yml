services:
  postgres:
    image: postgres:16
    container_name: medclinic-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medclinic
    ports:
      - "5434:5432"
    volumes:
      - medclinic-data:/var/lib/postgresql/data

volumes:
  medclinic-data:
